  @page { size: 594mm 420mm; margin: 0; }
  html, body { margin: 0; padding: 0; background: #FFFFFF; }
  /* A peca fisica: 594 x 420 mm.  A arte foi desenhada a 2.0 mm por px. */

  .arte { position: absolute; top: 0; left: 0;
           width: 297.0px; height: 210.0px;
           transform: scale(7.559055); transform-origin: top left; }
  @media screen { body { background: #DDE1E5; padding: 0; }
                   .peca { margin: 0 auto; box-shadow: 0 0 0 1px #9AA3AB; background: #FFF; } }
</style>
</head>

  <div style="display: flex; align-items: center; gap: 12px;">
