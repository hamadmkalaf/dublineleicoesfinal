<!doctype html>
<html lang="pt-BR">
<head>

<title>P5-preferencial</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;900&display=swap');
  @page { size: 2000mm 1000mm; margin: 0; }
  html, body { margin: 0; padding: 0; background: #FFFFFF; }
  /* A peca fisica: 2000 x 1000 mm.  A arte foi desenhada a 2.0 mm por px. */
  .peca { width: 2000mm; height: 1000mm; overflow: hidden; position: relative; }
  .arte { position: absolute; top: 0; left: 0;
           width: 1000.0px; height: 500.0px;
           transform: scale(7.559055); transform-origin: top left; }
  @media screen { body { background: #DDE1E5; padding: 0; }

</style>
</head>
